name: Release
on:
  push:
    branches:
      - main

permissions: write-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "latest"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Prepare dist for publishing
        run: |
          cp package.json README.md LICENSE openclaw.plugin.json .releaserc.json dist/
          cp -r skills dist/
          cp -r scripts dist/

      - name: Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: dist
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dist/package.json version
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          cd dist
          node -e "const p=require('./package.json'); p.version='${{ steps.semantic.outputs.new_release_version }}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Install ClawHub CLI
        if: steps.semantic.outputs.new_release_published == 'true'
        run: npm i -g clawhub

      - name: Publish to ClawHub
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
          clawhub package publish dist/ \
            --family code-plugin \
            --version "${{ steps.semantic.outputs.new_release_version }}" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ steps.semantic.outputs.new_release_git_tag }}" \
            --changelog "${{ steps.semantic.outputs.new_release_notes }}" \
            --tags latest
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
