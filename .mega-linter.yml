# MegaLinter configuration file
# More info at https://megalinter.io
APPLY_FIXES: all
SHOW_ELAPSED_TIME: true

EXCLUDED_DIRECTORIES:
  - node_modules
  - dist
  - .npm_cache
  - .git

DISABLE_LINTERS:
  # Spell checkers — too many false positives with project-specific terms and example URLs
  - SPELL_CSPELL
  - SPELL_LYCHEE
  - MARKDOWN_MARKDOWN_LINK_CHECK
  # ts-standard conflicts with eslint config and can't parse integration/ files outside tsconfig
  - TYPESCRIPT_STANDARD
  # grype flags vulnerabilities in MegaLinter's own Go runtime, not our code
  - REPOSITORY_GRYPE
