# MegaLinter configuration file
# More info at https://megalinter.io
APPLY_FIXES: all
SHOW_ELAPSED_TIME: true

# Exclude directories that should not be scanned
EXCLUDES:
  - node_modules
  - dist
  - .npm_cache
  - .git

# Disable linters that are redundant or too noisy for this initial phase
DISABLE_LINTERS:
  - REPOSITORY_GRYPE # Security vulnerabilities in dependencies
  - REPOSITORY_GITLEAKS # False positives in tests/cache
  - SPELL_CSPELL # Spelling checks
  - SPELL_LYCHEE # Link checking
  - MARKDOWN_MARKDOWN_LINK_CHECK # Link checking
  - REPOSITORY_CHECKOV # Security checks
  - TYPESCRIPT_TS_STANDARD # Redundant with ESLint
  - TYPESCRIPT_STANDARD
  - JSON_PRETTIER # Avoid conflicts with other formatters
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER # Often conflicts with manual formatting
  - YAML_V8R # Failing on valid yaml

DISABLE_ERRORS_LINTERS:
  - TYPESCRIPT_TS_STANDARD
  - TYPESCRIPT_STANDARD
